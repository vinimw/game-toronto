<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Game Love · Protótipo de câmera</title>
<style>
  *{box-sizing:border-box;touch-action:none}
  body{margin:0;overflow:hidden;font:14px system-ui;background:#d9dec7}
  #game{position:fixed;inset:0} canvas{display:block}
  pre{position:fixed;right:12px;top:8px;padding:8px;color:white;background:#172e28;pointer-events:none;max-width:95vw}
  #joystick,#mobile-run{position:fixed;bottom:22px;display:grid;place-items:center;border-radius:50%;color:#fff;background:#253e34aa}
  #joystick{left:22px;width:115px;height:115px}
  #stick{width:36px;height:36px;border-radius:50%;background:#faf4d8}
  #mobile-run{right:22px;width:56px;height:56px;border:0}
</style>
<div id="game"></div><pre id="telemetry"></pre>
<div id="joystick" aria-label="Joystick"><div id="stick"></div></div>
<button id="mobile-run" aria-label="Correr">↟</button>
<script type="module" src="./prototype.js"></script>
</html>
